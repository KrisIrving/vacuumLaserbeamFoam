# Check the laserbeamFoam solvers compile correctly
name: Build

on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        container-image:
          - name: "OpenFOAM-v2506"
            image: "opencfd/openfoam-dev:2506"
            source: "/usr/lib/openfoam/openfoam2506/etc/bashrc"
            buildflags: "-j"

    container:
      image: ${{ matrix.container-image.image }}
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Allwmake
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./Allwmake ${{ matrix.container-image.buildflags }}

      - name: Alltest
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          cd tutorials
          ./Alltest

      - name: Legacy model regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/legacyEquivalence/Allrun

      - name: Hertz-Knudsen reference smoke test
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/hertzKnudsenReference/Allrun

      - name: Hertz-Knudsen analytical curve regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/hertzKnudsenCurve/Allrun

      - name: Sonic Knudsen-layer regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/knudsenLayerSonic/Allrun

      - name: Knudsen transition relation regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/knudsenTransition/Allrun

      - name: Near-vacuum Wang model regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          ./tests/nearVacuumWang/Allrun

      - name: Wang alloy-mixture regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          bash ./tests/wangAlloyMixture/Allrun

      - name: Wang 304L reference regression
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          bash ./tests/wang304LReference/Allrun

      - name: Wang 304L CFD case smoke
        shell: bash -l {0}
        run: |
          source ${{ matrix.container-image.source }}
          bash ./tests/wang304LCaseSmoke/Allrun

      - name: Upload test logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-logs.${{ matrix.container-image.name }}
          path: |
            tutorialsTest/logs
            tests/run
          retention-days: 10

      - name: Set job status
        if: ${{ failure() }}
        run: echo "::error::Regression gate failed"
